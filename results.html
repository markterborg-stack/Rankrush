<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankRush - Uitslag</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header>
    <h1>RankRush</h1>
</header>

<main>

    <div class="card">

        <h2>Uitslag indienen</h2>

        <h3>Pixel Warriors vs Night Owls</h3>

        <label>Score Pixel Warriors</label>
        <input type="number" placeholder="0">

        <label>Score Night Owls</label>
        <input type="number" placeholder="0">

        <label>Opmerking</label>
        <textarea placeholder="Eventuele opmerkingen"></textarea>

        <button>Uitslag indienen</button>

        <p class="notice">
            De uitslag wordt eerst gecontroleerd door de leaguebeheerder.
        </p>

    </div>

</main>

</body>
</html>
