<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankRush - Uitslagen controleren</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header>
    <h1>RankRush - Beheer</h1>
</header>

<main>

    <h2>Uitslagen controleren</h2>

    <div class="match">

        <h3>Pixel Warriors vs Night Owls</h3>

        <div class="score">
            2 - 1
        </div>

        <p>Ingediend door: Pixel Warriors</p>
        <p class="status pending">Wacht op goedkeuring</p>

        <button>Goedkeuren</button>
        <button class="danger">Afwijzen</button>

    </div>

</main>

</body>
</html>
